name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The website is built and deployed only after the database, unit, typecheck, build and browser tests pass on this
  # commit (docs/shared-child-profiles-release-readiness.md section G). A failure or cancellation stops the deploy.
  db-tests:
    uses: ./.github/workflows/db-tests.yml
  browser-tests:
    uses: ./.github/workflows/e2e-tests.yml

  build:
    needs: [db-tests, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sign-in and analytics come from repository variables (Settings › Secrets and variables › Actions ›
      # Variables): the project's URL and publishable key (rootmap-staging, see docs/data-architecture-phase2.md
      # section 19), never a secret key (the build refuses it). Unset, the website builds local-only, as before.
      # VITE_ROOTMAP_SHARED_SYNC=on switches on Shared Child Profiles; only after rootmap-staging has the sharing
      # migrations (docs/shared-child-profiles-tester-rollout.md).
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_ROOTMAP_CLOUD: ${{ vars.VITE_ROOTMAP_CLOUD }}
          VITE_ROOTMAP_ANALYTICS: ${{ vars.VITE_ROOTMAP_ANALYTICS }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_ROOTMAP_SHARED_SYNC: ${{ vars.VITE_ROOTMAP_SHARED_SYNC }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
